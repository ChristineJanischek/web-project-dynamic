name: Assessment Security Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  sensitive-data-gate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Block sensitive assessment artifacts
        run: python3 scripts/check_sensitive_assessment_data.py

name: Backup Snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * 1"

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create backup snapshot
        run: |
          chmod +x scripts/create_backup_snapshot.sh
          ./scripts/create_backup_snapshot.sh backup-artifacts

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: repo-backup-snapshot
          path: backup-artifacts/
          retention-days: 30
